<!--
  Static preview of the Otterseas packing slip. Same HTML/CSS as the
  Liquid template, with example order data inlined so you can iterate
  on layout without touching Shopify admin.

  Three scenarios pre-built — toggle from the bar at the top.
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Packing Slip Preview</title>
<style>
  @page { size: A4 portrait; margin: 14mm; }
  * { box-sizing: border-box; }
  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: #1a1a1a;
    margin: 0;
    padding: 0;
    font-size: 10.5pt;
    line-height: 1.5;
    background: #d6d3cc;
  }
  .scenario-switcher {
    background: #023859;
    color: white;
    padding: 14px 20px;
    text-align: center;
    font-family: 'Helvetica Neue', sans-serif;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .scenario-switcher button {
    background: transparent;
    border: 1px solid #54ACBF;
    color: white;
    padding: 6px 14px;
    margin: 0 4px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .scenario-switcher button.active { background: #FF6B9D; border-color: #FF6B9D; }
  .scenario-switcher button:hover { background: #54ACBF; }
  .sheet {
    width: 210mm;
    min-height: 297mm;
    margin: 20px auto;
    padding: 14mm;
    background: white;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }
  .page { width: 100%; max-width: 182mm; margin: 0 auto; }

  @media print {
    body { background: white; }
    .scenario-switcher { display: none; }
    .sheet { box-shadow: none; margin: 0; padding: 0; min-height: auto; }
  }

  /* ---------- Hero ---------- */
  .hero {
    text-align: center;
    padding: 4mm 0 8mm;
    border-bottom: 1.5px solid #023859;
    margin-bottom: 22px;
  }
  .hero img.logo {
    width: 90px;
    height: 90px;
    margin: 0 auto 12px;
    display: block;
    object-fit: contain;
  }
  .hero .thank-you {
    font-size: 22pt;
    font-weight: 700;
    color: #023859;
    margin: 0 0 6px;
    line-height: 1.1;
  }
  .hero .thank-you .otter { font-size: 18pt; vertical-align: -1px; margin-left: 4px; }
  .hero .tagline {
    font-size: 8pt;
    letter-spacing: 0.32em;
    color: #54ACBF;
    font-weight: 700;
    text-transform: uppercase;
  }

  /* ---------- Order meta ---------- */
  .order-meta {
    display: flex;
    justify-content: space-between;
    margin-bottom: 22px;
    font-size: 10pt;
  }
  .order-meta .item .label {
    font-size: 7pt;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #888;
    font-weight: 600;
    margin-right: 8px;
  }
  .order-meta .item .value {
    color: #023859;
    font-weight: 700;
    font-size: 11pt;
  }

  .meta-grid { display: flex; gap: 24px; margin-bottom: 24px; }
  .meta-block { flex: 1; }
  .meta-block h3 {
    font-size: 8pt;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #023859;
    font-weight: 700;
    margin: 0 0 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid #023859;
  }
  .meta-block p { margin: 2px 0; font-size: 10.5pt; color: #1a1a1a; }

  .items-section h3 {
    font-size: 8pt;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #023859;
    font-weight: 700;
    margin: 0 0 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid #023859;
  }
  table.items { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
  table.items th {
    text-align: left;
    font-size: 8pt;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #888;
    font-weight: 600;
    padding: 8px 4px;
    border-bottom: 1px solid #ddd;
  }
  table.items th.thumb { width: 48px; }
  table.items th.qty { text-align: center; width: 60px; }
  table.items th.price { text-align: right; width: 80px; }
  table.items td {
    padding: 10px 4px;
    border-bottom: 1px dotted #ddd;
    font-size: 10.5pt;
    vertical-align: middle;
  }
  table.items td.thumb { width: 48px; padding: 6px 8px 6px 0; }
  table.items td.thumb .img-wrap {
    width: 40px;
    height: 40px;
    border-radius: 4px;
    background: #f5f3ee;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  table.items td.thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  table.items td.qty { text-align: center; color: #555; }
  table.items td.price { text-align: right; font-weight: 600; }
  table.items .variant { display: block; font-size: 9pt; color: #777; margin-top: 2px; }

  .total-row { display: flex; justify-content: flex-end; margin-top: 10px; }
  .total-row .total-box {
    min-width: 200px;
    border-top: 2px solid #023859;
    padding-top: 8px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .total-row .label {
    font-size: 9pt;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #023859;
    font-weight: 700;
  }
  .total-row .amount { font-size: 14pt; font-weight: 800; color: #023859; }

  .discount {
    margin: 24px 0 26px;
    padding: 14px 18px;
    border: 1.5px dashed #54ACBF;
    border-radius: 6px;
    background: #54ACBF0D;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .discount .icon { font-size: 22pt; line-height: 1; }
  .discount .body { flex: 1; }
  .discount .label {
    font-size: 8pt;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #54ACBF;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .discount .copy { color: #023859; font-size: 10.5pt; }
  .discount .code {
    font-family: 'Courier New', monospace;
    background: #023859;
    color: white;
    padding: 3px 10px;
    border-radius: 3px;
    font-weight: 700;
    font-size: 11pt;
    letter-spacing: 0.12em;
    margin: 0 2px;
  }

  .footer {
    margin-top: 30px;
    padding-top: 14px;
    border-top: 1px solid #ddd;
    text-align: center;
    font-size: 9pt;
    color: #666;
  }
  .footer .row { margin-bottom: 4px; }
  .footer .support a { color: #023859; font-weight: 600; text-decoration: none; }
  .footer .brand {
    margin-top: 10px;
    font-size: 8pt;
    letter-spacing: 0.32em;
    color: #023859;
    font-weight: 700;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="scenario-switcher">
  Scenario:
  <button data-scenario="full">Bottle + Journal + 3 stickers</button>
  <button data-scenario="bottle_stickers">Bottle + 3 stickers</button>
  <button data-scenario="stickers_only">Stickers only</button>
</div>

<div class="sheet">
<div class="page" id="slip"></div>
</div>

<script>
  // Sample product image URLs (live Shopify CDN — same images used on the site).
  const IMG = {
    surface_tank: 'https://38a44d-4c.myshopify.com/cdn/shop/files/Water_bottles_and_stickers.png?v=1769395822&width=200',
    dive_journal: 'https://38a44d-4c.myshopify.com/cdn/shop/files/Dive_Journal_-_Image_only.jpg?v=1769573325&width=200',
    komodo: 'https://38a44d-4c.myshopify.com/cdn/shop/files/Komodo-sticker.png?v=1769333996&width=200',
    raja_ampat: 'https://38a44d-4c.myshopify.com/cdn/shop/files/RajaAmpat-sticker.png?v=1769313395&width=200',
    sardinia: 'https://38a44d-4c.myshopify.com/cdn/shop/files/Sardina-sticker.png?v=1769313974&width=200',
    silfra: 'https://38a44d-4c.myshopify.com/cdn/shop/files/Silfra-sticker.png?v=1769313974&width=200',
    scapa: 'https://38a44d-4c.myshopify.com/cdn/shop/files/ScapaFlow-sticker.png?v=1769313974&width=200',
    cornwall: 'https://38a44d-4c.myshopify.com/cdn/shop/files/Cornwall-sticker.png?v=1769313974&width=200',
  };

  const SCENARIOS = {
    full: {
      name: '#1041',
      created_at: '12 May 2026',
      customer: { first_name: 'Daniel' },
      shipping_address: {
        first_name: 'Daniel', last_name: 'Lipinski',
        address1: '14 Reef Lane', address2: '',
        city: 'Brighton', province: '', zip: 'BN1 3JT',
        country: 'United Kingdom',
      },
      shipping_method: 'Royal Mail Tracked 48',
      line_items: [
        { title: 'The Surface Tank', variant_title: 'Deep Ocean', quantity: 1, line_price: '£35.00', image: IMG.surface_tank },
        { title: 'The Dive Journal', variant_title: '', quantity: 1, line_price: '£28.00', image: IMG.dive_journal },
        { title: 'Komodo', variant_title: '', quantity: 1, line_price: '£2.00', image: IMG.komodo },
        { title: 'Raja Ampat', variant_title: '', quantity: 1, line_price: '£2.00', image: IMG.raja_ampat },
        { title: 'Sardinia', variant_title: '', quantity: 1, line_price: '£2.00', image: IMG.sardinia },
      ],
      total_price: '£69.00',
    },
    bottle_stickers: {
      name: '#1042',
      created_at: '12 May 2026',
      customer: { first_name: 'Daniel' },
      shipping_address: {
        first_name: 'Daniel', last_name: 'Lipinski',
        address1: '14 Reef Lane', address2: '',
        city: 'Brighton', province: '', zip: 'BN1 3JT',
        country: 'United Kingdom',
      },
      shipping_method: 'Royal Mail Tracked 48',
      line_items: [
        { title: 'The Surface Tank', variant_title: 'Deep Ocean', quantity: 1, line_price: '£35.00', image: IMG.surface_tank },
        { title: 'Komodo', variant_title: '', quantity: 1, line_price: '£2.00', image: IMG.komodo },
        { title: 'Raja Ampat', variant_title: '', quantity: 1, line_price: '£2.00', image: IMG.raja_ampat },
        { title: 'Sardinia', variant_title: '', quantity: 1, line_price: '£2.00', image: IMG.sardinia },
      ],
      total_price: '£41.00',
    },
    stickers_only: {
      name: '#1043',
      created_at: '12 May 2026',
      customer: { first_name: 'Marcus' },
      shipping_address: {
        first_name: 'Marcus', last_name: 'Berg',
        address1: 'Kollektivgatan 12', address2: '',
        city: 'Stockholm', province: '', zip: '11340',
        country: 'Sweden',
      },
      shipping_method: 'International Tracked',
      line_items: [
        { title: 'Silfra', variant_title: '', quantity: 1, line_price: '£2.00', image: IMG.silfra },
        { title: 'Scapa Flow', variant_title: '', quantity: 1, line_price: '£2.00', image: IMG.scapa },
        { title: 'Cornwall', variant_title: '', quantity: 1, line_price: '£2.00', image: IMG.cornwall },
        { title: 'Sardinia', variant_title: '', quantity: 1, line_price: '£2.00', image: IMG.sardinia },
      ],
      total_price: '£8.00',
    },
  };

  function renderSlip(scenarioKey) {
    const order = SCENARIOS[scenarioKey];
    const totalItems = order.line_items.reduce((n, l) => n + l.quantity, 0);
    const cargo = order.line_items.map(l => `
      <tr>
        <td class="thumb">
          <div class="img-wrap">
            ${l.image ? `<img src="${l.image}" alt="${l.title}">` : ''}
          </div>
        </td>
        <td>
          ${l.title}
          ${l.variant_title ? `<span class="variant">${l.variant_title}</span>` : ''}
        </td>
        <td class="qty">× ${l.quantity}</td>
        <td class="price">${l.line_price}</td>
      </tr>
    `).join('');

    document.getElementById('slip').innerHTML = `
      <div class="hero">
        <img src="../../public/logo.png" alt="Otterseas" class="logo">
        <h1 class="thank-you">
          Thank you, ${order.customer.first_name}.<span class="otter">🦦</span>
        </h1>
        <div class="tagline">Made by a diver, for divers</div>
      </div>

      <div class="order-meta">
        <div class="item">
          <span class="label">Order</span><span class="value">${order.name}</span>
        </div>
        <div class="item">
          <span class="label">Date</span><span class="value">${order.created_at}</span>
        </div>
      </div>

      <div class="meta-grid">
        <div class="meta-block">
          <h3>Ship to</h3>
          <p><strong>${order.shipping_address.first_name} ${order.shipping_address.last_name}</strong></p>
          <p>${order.shipping_address.address1}</p>
          ${order.shipping_address.address2 ? `<p>${order.shipping_address.address2}</p>` : ''}
          <p>${order.shipping_address.city}${order.shipping_address.province ? ', ' + order.shipping_address.province : ''} ${order.shipping_address.zip}</p>
          <p>${order.shipping_address.country}</p>
        </div>
        <div class="meta-block">
          <h3>Order summary</h3>
          <p><strong>Order:</strong> ${order.name}</p>
          <p><strong>Date:</strong> ${order.created_at}</p>
          <p><strong>Items:</strong> ${totalItems}</p>
          ${order.shipping_method ? `<p><strong>Shipping:</strong> ${order.shipping_method}</p>` : ''}
        </div>
      </div>

      <div class="items-section">
        <h3>Items</h3>
        <table class="items">
          <thead>
            <tr>
              <th class="thumb"></th>
              <th>Description</th>
              <th class="qty">Qty</th>
              <th class="price">Price</th>
            </tr>
          </thead>
          <tbody>${cargo}</tbody>
        </table>

        <div class="total-row">
          <div class="total-box">
            <span class="label">Total</span>
            <span class="amount">${order.total_price}</span>
          </div>
        </div>
      </div>

      <div class="discount">
        <div class="icon">🦦</div>
        <div class="body">
          <div class="label">A thank-you from the otter</div>
          <div class="copy">
            Enjoy <strong>20% off</strong> your next order with code
            <span class="code">OTTERLOVE20</span>
            — minimum spend £10.
          </div>
        </div>
      </div>

      <div class="footer">
        <div class="row">
          Questions? <span class="support"><a href="mailto:support@otterseas.com">support@otterseas.com</a></span> · 30-day returns
        </div>
        <div class="brand">Otterseas · otterseas.com</div>
      </div>
    `;

    document.querySelectorAll('.scenario-switcher button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.scenario === scenarioKey);
    });
  }

  document.querySelectorAll('.scenario-switcher button').forEach(btn => {
    btn.addEventListener('click', () => renderSlip(btn.dataset.scenario));
  });

  renderSlip('full');
</script>

</body>
</html>
